name: Costruisci app Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install --no-deps transkun==2.0.1
          pip install piano_transcription_inference
          pip install pyinstaller pyflakes

      - name: Controllo del codice
        run: python -m pyflakes partitura.py banco_prova.py prova_spartiti.py setup_partitura.py

      - name: Collaudo della notazione (banco di prova)
        run: python banco_prova.py --semi 2

      - name: Collaudo su spartiti veri
        run: python prova_spartiti.py --semi 1

      - name: Collaudo completo da audio (Transkun)
        shell: pwsh
        run: |
          python tests/genera_audio_prova.py
          python partitura.py tests/prova.wav -o collaudo_py -t "Collaudo" --bpm 138
          if (-not (Test-Path collaudo_py/Collaudo.pdf)) { Get-Content collaudo_py/partitura_ultimo.log; exit 1 }

      - name: Collaudo dell'interfaccia
        shell: pwsh
        run: |
          $p = Start-Process -FilePath python -ArgumentList @("partitura.py","--prova-gui","tests\prova.mid") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: FFmpeg da includere
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName packaging/ffmpeg.exe

      - name: Compila l'app
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build partitura.spec

      - name: Collaudo dell'app compilata
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/Partitura/Partitura.exe").Path
          $fallito = $false
          foreach ($caso in @(@("tests\prova.mid","midi"), @("tests\prova.wav","audio"))) {
            $out = Join-Path $PWD "collaudo_exe_$($caso[1])"
            $src = Join-Path $PWD $caso[0]
            $p = Start-Process -FilePath $exe -ArgumentList @("`"$src`"","-o","`"$out`"","-t","Collaudo","--bpm","138") -Wait -PassThru -NoNewWindow
            Write-Host "== $($caso[1]): codice di uscita $($p.ExitCode)"
            if (Test-Path "$out/partitura_ultimo.log") { Get-Content "$out/partitura_ultimo.log" }
            $crash = Join-Path $env:LOCALAPPDATA "Partitura\errore.log"
            if (Test-Path $crash) { Write-Host "--- errore.log"; Get-Content $crash; Remove-Item $crash }
            if (Test-Path "$out/Collaudo.pdf") { Write-Host "OK $($caso[1])" } else { $fallito = $true }
          }
          $p = Start-Process -FilePath $exe -ArgumentList @("--prova-gui","`"$(Join-Path $PWD 'tests\prova.wav')`"") -Wait -PassThru -NoNewWindow
          Write-Host "== interfaccia: codice di uscita $($p.ExitCode)"
          $crash = Join-Path $env:LOCALAPPDATA "Partitura\errore.log"
          if (Test-Path $crash) { Get-Content $crash }
          if ($p.ExitCode -ne 0) { $fallito = $true }
          if ($fallito) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnosi
          path: |
            collaudo_exe_*
            build/partitura/warn-partitura.txt
          retention-days: 7

      - name: Installatore
        shell: pwsh
        run: |
          $env:PARTITURA_VERSIONE = (Select-String -Path partitura.py -Pattern '^VERSIONE = "(.+)"').Matches[0].Groups[1].Value
          "VERSIONE=$env:PARTITURA_VERSIONE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
          Get-ChildItem dist/*.exe

      - name: Collaudo dell'app installata in Programmi
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/Partitura-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/ALLUSERS","/SUPPRESSMSGBOXES","/NORESTART") -Wait
          $exe = Join-Path $env:ProgramFiles "Partitura\Partitura.exe"
          if (-not (Test-Path $exe)) { Write-Host "non installata in $exe"; exit 1 }
          $d = Join-Path $env:LOCALAPPDATA "Partitura"
          Remove-Item "$d\avvio.log","$d\errore.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList @("--prova-gui","`"$(Join-Path $PWD 'tests\prova.mid')`"") -Wait -PassThru
          Write-Host "== app installata: codice di uscita $($p.ExitCode)"
          foreach ($f in "avvio.log","errore.log") { if (Test-Path "$d\$f") { Write-Host "--- $f"; Get-Content "$d\$f" } }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Partitura-Setup
          path: dist/Partitura-Setup-*.exe
          retention-days: 30

      - name: Pubblica la versione
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIONE }}
          name: Partitura ${{ env.VERSIONE }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Partitura-Setup-*.exe
